[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imu-host"
version = "0.1.0"
description = "Receive, record and calibrate the RAW IMU stream of the RP2040 board"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24"]

[project.scripts]
imu-host = "imu_host.__main__:main"

[tool.setuptools]
packages = ["imu_host"]
