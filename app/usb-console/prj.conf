CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
# Keep Wi-Fi credentials out of shell command history.
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_I2C_SHELL=y
CONFIG_I2C_SHELL_BUFFER_SIZE=64
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_SENSOR_SHELL_STREAM=y
CONFIG_SENSOR_SHELL_THREAD_STACK_SIZE=3072
CONFIG_STACK_SENTINEL=y
CONFIG_POLL=y
CONFIG_LSM6DSO=y
CONFIG_REBOOT=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_OUTPUT=y
CONFIG_LOG_TIMESTAMP_64BIT=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Zephyr USB Console"

# Measure active time from CPU idle windows, including interrupts.
CONFIG_CPU_LOAD=y
CONFIG_CPU_LOAD_BACKEND_IDLE_HOOK=y

# Use DMA for eligible I2C0 reads.
CONFIG_DMA=y
CONFIG_I2C_DW_RP2040_DMA=y

# NINA Wi-Fi management and socket offload.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_NINA_LOCAL=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_ZVFS_POLL_MAX=16
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_IPERF3=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_MQTT_LIB=y
# Network event callbacks may print Wi-Fi results through the shell.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_WIFI_ESP_AT=n
# Temporary non-cryptographic random generator for network testing; no TLS.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_IPV6=n

# Persist the most recently successful Wi-Fi connection.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Identifies the board in automatically assigned IMU session IDs.
CONFIG_HWINFO=y

# Temporary: see Kconfig.
CONFIG_NINA_BENCHMARK_BOOTSEL=y
