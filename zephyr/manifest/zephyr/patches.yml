    module: hal_rpi_pico
    author: rp2040-connect
    email: noreply@example.invalid
    date: 2026-11-18
    upstreamable: false
    comments: |
      boot2 for the board's AT25SF128A at clk_sys / 2 (62.5 MHz) instead of
      clk_sys / 4.
  - path: zephyr/0001-arm-cortex-m-rp2040-divider-save.patch
    sha256sum: 5019e7f0581623999faf25982c7f318166ee5f0a4f6eb0878eaee532c1fdd76a
    module: zephyr
    author: rp2040-connect
    email: noreply@example.invalid
    date: 2026-11-18
    upstreamable: false
    comments: |
      CONFIG_ARM_RP2040_DIVIDER_SAVE: the SIO divider saved and restored in
