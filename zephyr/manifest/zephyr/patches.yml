# SPDX-License-Identifier: MIT
#
# Local patches of this workspace's Zephyr and modules, applied to their
# working trees (git apply, no commits) by "west patch apply", which
# script/setup.sh runs.  The syntax is Zephyr's
# scripts/schemas/patch-schema.yml.  After changing a patch, update its
# sha256sum (sha256sum <file>); script/setup.sh then takes back the patches it
# applied before and applies the new set.

patches:
  - path: hal_rpi_pico/0001-boot2-at25sf128a-clkdiv-2.patch
    sha256sum: 1d01e03728a8c35b0e2fb31c9ac809bc4cfa5c750d3da02336cbfbabe1ad1b8c
    module: hal_rpi_pico
    author: rp2040-connect
    email: noreply@example.invalid
    date: 2026-11-18
    upstreamable: false
    comments: |
      boot2 for the board's AT25SF128A at clk_sys / 2 (62.5 MHz) instead of
      clk_sys / 4.
  - path: zephyr/0001-arm-cortex-m-rp2040-divider-save.patch
    sha256sum: 5019e7f0581623999faf25982c7f318166ee5f0a4f6eb0878eaee532c1fdd76a
    module: zephyr
    author: rp2040-connect
    email: noreply@example.invalid
    date: 2026-11-18
    upstreamable: false
    comments: |
      CONFIG_ARM_RP2040_DIVIDER_SAVE: the SIO divider saved and restored in
      PendSV, for the Pico SDK's pico_divider (app CONFIG_NANO_HW_DIVIDER).
  - path: zephyr/0002-soc-rp2040-rom-mem-ops.patch
    sha256sum: 1e9cfbfac28612b09001b64eca497fc78e54e90ae34c83f58cc5e6bc553aa294
    module: zephyr
    author: rp2040-connect
    email: noreply@example.invalid
    date: 2026-11-18
    upstreamable: false
    comments: |
      CONFIG_RP2040_ROM_MEM_OPS: memcpy() and memset() through the bootrom's
      routines (--wrap), enabled in the app's prj.conf.
  - path: zephyr/0003-i2c-dw-rp2040-fifo-and-dma.patch
    sha256sum: 5041f3b42e2e7360dd87f98b09df8eaecdf819e3590f4c254b9b781e6023ca68
    module: zephyr
    author: rp2040-connect
    email: noreply@example.invalid
    date: 2026-11-18
    upstreamable: false
    comments: |
      The DesignWare I2C driver on the RP2040: the FIFO depth and RX batch of
      its controllers, and CONFIG_I2C_DW_RP2040_DMA (i2c0 reads through the
      DMA controller, and the functions of the app's "i2c_dma" command in
      <zephyr/drivers/i2c/i2c_dw_rp2040_dma.h>), enabled in the app's
      prj.conf.
  - path: zephyr/0004-i2c-shell-scan-not-supported.patch
    sha256sum: a4158eaad8dc586a8124cf246ab408ba891971a4f147fedd405decd74026cc83
    module: zephyr
    author: rp2040-connect
    email: noreply@example.invalid
    date: 2026-11-21
    upstreamable: false
    comments: |
      The shell's "i2c scan" stops and returns -ENOTSUP, with a message,
      when the controller refuses its zero-length probes (the DesignWare
      driver of patch 0003), instead of reporting "0 devices found".
  - path: zephyr/0006-sensor-shell-fifo-attributes.patch
    sha256sum: 2eac826ac57585cd2acb44eb9f7da921c6f3e1b48ec6f9b2558b67ebdf932da6
    module: zephyr
    author: rp2040-connect
    email: noreply@example.invalid
    date: 2026-11-22
    upstreamable: false
    comments: |
      The sensor shell (drivers/sensor/sensor_shell.c) with the LSM6DSO's
      FIFO attributes and the handling of FIFO batches and canceled reads,
      for the LSM6DSO driver of common/drivers/lsm6dso, whose Zephyr build
      rules export <zephyr/drivers/sensor/lsm6dso.h>.  sensor_shell.c is the
      other builds' too (common/drivers/sensor_shell), sensor_shell_os.h is
      this build's.
